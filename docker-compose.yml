version: "3.8"

services:
  home-finder:
    build: .
    container_name: home-finder
    restart: unless-stopped
    volumes:
      - /local/docker/home-finder/data:/app/data
      - /local/docker/home-finder/logs:/var/log
    environment:
      - TZ=America/Los_Angeles
      - FLARE_SOLVERR_URL=http://flaresolverr:8191
    ports:
      - "3013:80"
    networks:
      - home-finder-net
      - proxy
    depends_on:
      - flaresolverr
    labels:
      - "traefik.enable=false"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
    networks:
      - home-finder-net

networks:
  home-finder-net:
    driver: bridge
  proxy:
    external: true
